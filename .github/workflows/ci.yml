name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    name: Test (${{ matrix.os }})
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Style Checks
        run: make check

      - name: Validate contributors
        run: make test
